name: Bot Crons
on:
  schedule:
    - cron: '*/30 * * * *'  # spot strategies + cross-dex (sharded)
    - cron: '0 * * * *'     # hourly: pool discovery + analytics
    - cron: '*/15 * * * *'  # execute pending opportunities
    - cron: '*/20 * * * *'  # scan + execute (cross-dex)
    - cron: '0 2 * * *'     # daily cleanup (2 AM UTC)
  workflow_dispatch: {}

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Spot Strategies (*/30)
        if: github.event.schedule == '*/30 * * * *'
        run: |
          curl -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/spot-strategies \
            -H "Content-Type: application/json" \
            --max-time 60

      - name: Cross-DEX Shard 1/3 (*/30)
        if: github.event.schedule == '*/30 * * * *'
        run: |
          curl -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/cross-dex \
            -H "Content-Type: application/json" \
            -d '{"shard": 1, "totalShards": 3}' \
            --max-time 120

      - name: Cross-DEX Shard 2/3 (*/30)
        if: github.event.schedule == '*/30 * * * *'
        run: |
          sleep 5
          curl -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/cross-dex \
            -H "Content-Type: application/json" \
            -d '{"shard": 2, "totalShards": 3}' \
            --max-time 120

      - name: Cross-DEX Shard 3/3 (*/30)
        if: github.event.schedule == '*/30 * * * *'
        run: |
          sleep 10
          curl -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/cross-dex \
            -H "Content-Type: application/json" \
            -d '{"shard": 3, "totalShards": 3}' \
            --max-time 120

      - name: Hourly Discovery (0 * * * *)
        if: github.event.schedule == '0 * * * *'
        run: |
          curl -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/hourly-discovery \
            -H "Content-Type: application/json" \
            --max-time 180

      - name: Execute Pending (*/15)
        if: github.event.schedule == '*/15 * * * *'
        run: |
          curl -X POST https://funbo-execution.nobtx-io.workers.dev/api/cron/execute \
            -H "Content-Type: application/json" \
            --max-time 120

      - name: Scan & Execute (*/20)
        if: github.event.schedule == '*/20 * * * *'
        run: |
          curl -X POST https://funbo-execution.nobtx-io.workers.dev/api/cron/scan-and-execute \
            -H "Content-Type: application/json" \
            -d '{"chainId": 137}' \
            --max-time 120

      - name: Analytics Hourly (0 * * * *)
        if: github.event.schedule == '0 * * * *'
        run: |
          curl -X POST https://funbo-analytics.nobtx-io.workers.dev/api/cron/analytics \
            -H "Content-Type: application/json" \
            --max-time 180

      - name: Daily Cleanup (0 2 * * *)
        if: github.event.schedule == '0 2 * * *'
        run: |
          curl -X POST https://funbo-analytics.nobtx-io.workers.dev/api/cron/cleanup \
            -H "Content-Type: application/json" \
            -d '{"oppDays": 30, "tradeDays": 90, "pnlDays": 180}' \
            --max-time 60
