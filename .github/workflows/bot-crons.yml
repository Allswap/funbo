name: Bot Crons
# Multi-scheduler (see /media/joop/J/gh-org/funbo-crons-compare.md & bstone-STATUS.md §4,7,11)
# GH Actions (*/30 = 48 runs/day ≈1440 min/mo <2000): spot + cross-dex shards + scan-and-execute (+ execute 30m fallback) — GH is fallback now
# cron-job.org (FREE, outside GH): spot 15m (96/d) + cross-dex 15m (96×3 shards) + execute 5m (288/d) + hourly @:00 + daily @02:00
# GH */15 would be 96/d=2880 OVER → cron-job.org handles fast cadence free. GH stays 30m as safety.
# Before: 5 schedules 241/d=7230 OVER → 1 schedule 48/d consolidated. Now split with external 15m/5m.
on:
  schedule:
    - cron: '*/30 * * * *'  # 48/day = 1440/mo. Covers spot + cross-dex shards + execute + scan-execute every 30m; hourly+cleanup conditional
  workflow_dispatch: {}

concurrency:
  group: bot-crons
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Spot Strategies
        run: |
          set -e
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Spot strategies"
          curl --fail --show-error -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/spot-strategies \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            --max-time 60 --retry 1 --retry-delay 5
          echo "spot: $?"

      - name: Cross-DEX Shards 1-3
        run: |
          set -e
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Cross-DEX shards"
          curl --fail --show-error -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/cross-dex \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            -d '{"shard": 1, "totalShards": 3}' \
            --max-time 120 --retry 1 --retry-delay 5
          echo "shard 1 done"
          sleep 5
          curl --fail --show-error -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/cross-dex \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            -d '{"shard": 2, "totalShards": 3}' \
            --max-time 120 --retry 1 --retry-delay 5
          echo "shard 2 done"
          sleep 5
          curl --fail --show-error -X POST https://funbo-discovery.nobtx-io.workers.dev/api/cron/cross-dex \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            -d '{"shard": 3, "totalShards": 3}' \
            --max-time 120 --retry 1 --retry-delay 5
          echo "shard 3 done"

      - name: Execute Pending
        run: |
          set -e
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Execute pending"
          curl --fail --show-error -X POST https://funbo-execution.nobtx-io.workers.dev/api/cron/execute \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            --max-time 120 --retry 1 --retry-delay 5

      - name: Scan & Execute
        run: |
          set -e
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Scan & execute"
          curl --fail --show-error -X POST https://funbo-execution.nobtx-io.workers.dev/api/cron/scan-and-execute \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.CRON_API_KEY }}" \
            -d '{"chainId": 137}' \
            --max-time 120 --retry 1 --retry-delay 5

            # NOTE: Hourly + Daily + spot 15m/cross-dex 15m + execute 5m moved to cron-job.org (see /media/joop/J/gh-org/funbo-crons-compare.md & bstone-STATUS.md §7).
      # GH Actions now only does 30m core scans as fallback (spot + cross-dex + scan-and-execute). Externals handle fast cadence FREE.
      # If cron-job.org is down, re-enable below 2 jobs (uncomment) — still within GH limit when conditional @:00/@02:00.
      # cron-job.org jobs:
      # - spot 15m: */15 * * * * → POST https://funbo-discovery.../api/cron/spot-strategies (X-API-Key, 60s, dedup 10m)
      # - cross-dex 15m: */15 * * * * → POST .../cross-dex {"shard":1-3,"totalShards":3} ×3 (X-API-Key, 120s, dedup 15m per shard)
      # - execute 5m: */5 * * * * → POST .../execute (no dedup) + hourly 0 * * * * → hourly-discovery+analytics + daily 0 2 * * * → cleanup
