name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workers:
    name: Deploy Workers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [funbo, funbo-discovery, funbo-execution, funbo-analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Debug secret
        run: |
          echo "HAS_CF_TOKEN=${{ secrets.CF_TOKEN != '' }}"
          echo "HAS_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN != '' }}"
          echo "TRIGGER=${{ github.event_name }}"
          echo "REF=${{ github.ref }}"
      - name: Deploy ${{ matrix.dir }}
        run: npx wrangler deploy
        working-directory: worker/${{ matrix.dir }}


