name: Ubuntu OS Config
version: 1.0.0
schema: v1

models:
  # --- MISTRAL (High Capacity Chat) ---
  - name: "Mistral Large (Cloud)"
    provider: mistral
    model: mistral-large-latest
    apiKey: MqE1jt7rnDn9xhcnqvkvHoeA04ZcBUqs
    roles:
      - chat
      - summarize

  # --- MISTRAL (Dedicated Coding Specialist) ---
  - name: "Codestral (Cloud)"
    provider: mistral
    model: codestral-latest
    apiKey: MqE1jt7rnDn9xhcnqvkvHoeA04ZcBUqs
    roles:
      - edit
      - apply

  # --- TOGETHER AI (Backup Edit) ---
  - name: Qwen 2.5 Coder 32B (Together)
    provider: together
    model: Qwen/Qwen2.5-Coder-32B-Instruct
    apiKey: YOUR_TOGETHER_KEY
    roles:
      - edit

  # --- GROQ (Original - keep as primary) ---
  - name: Llama 3.3 70B (Groq)
    provider: groq
    model: llama-3.3-70b-versatile
    apiKey: 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
    roles:
      - chat
      - edit
  # --- This model will auto-select ONLY for Autocomplete
  - name: "granite4.1:8b (Local)"
    provider: "ollama"
    model: "granite4.1:8b"
    roles:
      - chat
      - edit
      - apply
      - autocomplete
    autocompleteOptions:
      debounceDelay: 100 # Very fast response 
      
  - name: "qwen3:8b (Local)"
    provider: "ollama"
    model: "qwen3:8b"
    roles:
      - chat
      - edit
      - apply

  - name: "Gemma Local"
    provider: "ollama"
    model: "gemma4:e4b"
    roles:
      - chat
      - summarize
      
      
  # --- This is your manual fallback (no roles, so it won't auto-take over)
  - name: DeepSeek Local
    provider: ollama
    model: deepseek-coder-v2:lite
    roles: 
      - chat
      - summarize
      
# MCP Servers that Continue can access
# https://docs.continue.dev/customization/mcp-tools
mcpServers:
  - uses: anthropic/memory-mcp